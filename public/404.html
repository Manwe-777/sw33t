<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sw33t</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts the path to a query string and redirects to index.html
      // The index.html will then restore the path
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      
      // Store the path in sessionStorage for index.html to pick up
      sessionStorage.setItem('spa-redirect', path + search + hash);
      
      // Redirect to the base URL
      window.location.replace('/sw33t/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
